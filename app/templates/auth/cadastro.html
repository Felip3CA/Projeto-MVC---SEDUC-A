{% extends "base.html" %}

{% block title %}Cadastro{% endblock %}

{% block content %}
<div class="card">
    <h1 class="page-title">Criar conta</h1>
    <form action="/auth/cadastro" method="post" class="form-grid">
        <div>
            <label for="nome">Nome</label>
            <input type="text" id="nome" name="nome" required>
        </div>
        <div>
            <label for="email">E-mail</label>
            <input type="email" id="email" name="email" required>
        </div>
        <div>
            <label for="senha">Senha</label>
            <input type="password" id="senha" name="senha" minlength="4" required>
        </div>

        {% if erro %}
            <div class="alert error">{{ erro }}</div>
        {% endif %}

        <button type="submit">Cadastrar</button>
    </form>

    <p class="form-footnote">Já tem conta? <a class="small-link" href="/auth/login">Entrar</a></p>
</div>
{% endblock %}
