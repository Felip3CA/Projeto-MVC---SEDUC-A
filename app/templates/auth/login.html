{% extends "base.html" %}

{% block title %}Login{% endblock %}

{% block content %}
<div class="card">
    <h1 class="page-title">Entrar no sistema</h1>
    <form action="/auth/login" method="post" class="form-grid">
        {% if request.query_params.get("cadastro") == "ok" %}
            <div class="alert success">Cadastro realizado! Faça login.</div>
        {% endif %}

        <div>
            <label for="email">E-mail</label>
            <input type="email" id="email" name="email" required>
        </div>
        <div>
            <label for="senha">Senha</label>
            <input type="password" id="senha" name="senha" required>
        </div>

        {% if erro %}
            <div class="alert error">{{ erro }}</div>
        {% endif %}

        <button type="submit">Entrar</button>
    </form>

    <p class="form-footnote">Não tem conta? <a class="small-link" href="/auth/cadastro">Cadastre-se</a></p>
</div>
{% endblock %}
